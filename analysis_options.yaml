include: package:flutter_lints/flutter.yaml

linter:
  rules:
    - use_super_parameters
    - prefer_const_declarations
    - unnecessary_lambdas
    - avoid_redundant_argument_values
    - prefer_final_locals
    - no_raw_types
    - no_dynamic_casts
    - simple_directive_paths
    - use_primary_constructors

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  exclude:
    - build/**
    # tool/ 下是手跑的实测脚本，靠 print 出结果，不是产品代码。
    # 不排掉的话 CI 的 --fatal-infos 会把每一条 print 都当失败。
    - tool/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**

plugins:
  riverpod_lint:
    version: ^3.1.4
    diagnostics:
      avoid_ref_inside_state_dispose: true
      avoid_public_notifier_properties: true
      missing_provider_scope: true
