name: fus_inbox
description: "查看公共美国号码池的最新短信，可选号、可按州与区号筛选"
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.5"

dependencies:
  dynamic_color: ^2.1.0
  flutter:
    sdk: flutter
  material_ui: ^1.7.0
  material_3_expressive: ^1.1.7
  material_color_utilities: ^0.13.0
  webview_flutter: ^4.14.1
  webview_flutter_android: ^4.14.1
  webview_flutter_wkwebview: ^3.26.2
  flutter_riverpod: ^3.4.3
  pub_semver: ^2.2.1
  shared_preferences: ^2.5.6
  riverpod_annotation: ^4.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  riverpod_lint: ^3.1.9
  shared_preferences_platform_interface: ^2.4.2
  riverpod_generator: ^4.0.9
  integration_test:
    sdk: flutter

# cli_util 0.6.0 被 flutter_launcher_icons 的版本上限卡住，这里抬过去。
# 任何 pub 升级后都要重跑 flutter analyze / flutter test / APK 构建验证。
# test_api 与 material_color_utilities 由 Flutter SDK 自身钉住，不要动。
dependency_overrides:
  cli_util: ^0.6.0

flutter:
  uses-material-design: true
  assets:
    - assets/icon/icon.png
    - assets/js/

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path_android: "assets/icon/ic_launcher.png"
  adaptive_icon_background: "assets/icon/ic_launcher_background.png"
  adaptive_icon_foreground: "assets/icon/ic_launcher_foreground.png"
  adaptive_icon_monochrome: "assets/icon/ic_launcher_monochrome.png"
  min_sdk_android: 21
  image_path_ios: "assets/icon/icon.png"
